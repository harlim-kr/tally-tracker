<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1"/>
<title>탈리 트래커</title>
<script>document.addEventListener("DOMContentLoaded",()=>{const u=new URLSearchParams(window.location.search).get("user");if(u&&u!=="main")document.title="탈리 트래커 · "+u;});</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#3a3635;--ink2:#6b6460;--ink3:#a8a09c;
  --bg:#fffdf9;--bg2:#f5f0ea;--bg3:#efefec;
  --bd:#e8e0d8;--bd2:#d4c8be;
  --green:#8ed4b0;--red:#f0a898;
  --r:8px;--rl:12px;
}
body{background:#f0ebe3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);min-height:100vh;}
.app{max-width:540px;margin:0 auto;padding:16px;}
.nav{display:flex;border-bottom:1px solid var(--bd);margin-bottom:18px;}
.nb{font-size:12px;letter-spacing:0.06em;padding:8px 14px;cursor:pointer;color:var(--ink3);border:none;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;}
.nb.on{color:#5c4f47;border-bottom-color:#5c4f47;}
.page{display:none;}.page.on{display:block;}
.card{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--rl);padding:16px 18px;margin-bottom:12px;}
.clabel{font-size:11px;letter-spacing:0.07em;color:var(--ink3);margin-bottom:10px;text-transform:uppercase;}
.goal-row{display:flex;gap:6px;align-items:baseline;padding:2px 0;}
.gperiod{font-size:11px;color:var(--ink3);min-width:40px;}
.gval{font-size:12px;color:var(--ink2);}
.gempty{font-size:12px;color:var(--ink3);font-style:italic;}
.tally-wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;min-height:36px;}
.tally-group{display:inline-block;position:relative;}
.tstats{font-size:12px;color:var(--ink3);margin-top:8px;}
.todo-list{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.todo-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:0.5px solid var(--bd);border-radius:var(--r);background:var(--bg);cursor:grab;user-select:none;}
.todo-item:hover{background:var(--bg2);}
.todo-item.drag-over{border-color:var(--ink);}
.tchk{width:16px;height:16px;border:1px solid var(--bd2);border-radius:3px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.tchk:hover{border-color:var(--ink);}
.tbadge{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--bg2);color:var(--ink3);}
.tbadge.thick{background:#faeeda;color:#633806;}
.add-row{display:flex;gap:6px;margin-top:8px;}
.add-row input{flex:1;font-size:13px;padding:7px 10px;border:0.5px solid var(--bd2);border-radius:var(--r);background:var(--bg);color:var(--ink);}
.btn{font-size:12px;padding:7px 12px;border:0.5px solid var(--bd2);border-radius:var(--r);background:transparent;cursor:pointer;color:var(--ink);font-family:inherit;white-space:nowrap;}
.btn:hover{background:var(--bg2);}
.btn-acc{background:#5c4f47;color:#fff;border-color:#5c4f47;}
.btn-acc:hover{opacity:0.85;background:#5c4f47;}
.divider{height:0.5px;background:var(--bd);margin:14px 0;}
.sinput{width:100%;font-size:13px;padding:7px 10px;border:0.5px solid var(--bd2);border-radius:var(--r);background:var(--bg);color:var(--ink);margin-bottom:8px;font-family:inherit;}
.erow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--bd);}
.erow:last-child{border-bottom:none;}
.etxt{font-size:13px;color:var(--ink);flex:1;}
.edot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ebtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd2);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font-family:inherit;transition:all 0.1s;}
.ebtn.ap{background:var(--green);border-color:var(--green);color:#fff;}
.ebtn.am{background:var(--red);border-color:var(--red);color:#fff;}
.fe-item{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
.fe-item input{flex:1;font-size:13px;padding:6px 10px;border:0.5px solid var(--bd2);border-radius:var(--r);background:var(--bg);color:var(--ink);font-family:inherit;}
.pmtog{display:flex;border:0.5px solid var(--bd2);border-radius:var(--r);overflow:hidden;}
.pmbtn{width:32px;height:32px;border:none;cursor:pointer;font-size:14px;background:transparent;color:var(--ink3);font-family:inherit;}
.pmbtn.ap{background:var(--green);color:#fff;}
.pmbtn.am{background:var(--red);color:#fff;}
.log-card{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--rl);padding:14px 16px;margin-bottom:10px;}
.log-date{font-size:11px;color:var(--ink3);letter-spacing:0.06em;margin-bottom:8px;}
.log-marks{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:6px;}
.log-wu{font-size:12px;color:var(--ink3);line-height:1.7;margin-top:4px;}
.mo-proj{margin-bottom:18px;}
.mo-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.mo-dot{width:9px;height:9px;border-radius:50%;}
.mo-lbl{font-size:12px;color:var(--ink2);}
.mo-marks{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center;z-index:200;}
.modal{background:var(--bg);border-radius:var(--rl);padding:20px;min-width:200px;box-shadow:0 4px 24px rgba(0,0,0,0.12);}
.modal-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:12px;}
.mopt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--ink);}
.mopt:hover{background:var(--bg2);}
.mdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.tip{position:fixed;background:rgba(58,54,53,0.92);color:#fff;border-radius:8px;padding:7px 12px;font-size:12px;z-index:300;pointer-events:none;max-width:200px;line-height:1.6;white-space:pre-line;}
.set-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;color:var(--ink);}
.toggle-btn{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:none;cursor:pointer;font-family:inherit;padding:0;}
@keyframes pinRainbow{
  0%{border-color:#f0a8a8;}
  16%{border-color:#f0c8a8;}
  33%{border-color:#f0e8a8;}
  50%{border-color:#8ed4b0;}
  66%{border-color:#a8c8f0;}
  83%{border-color:#c4b8e8;}
  100%{border-color:#f0a8a8;}
}
.exp-node-pinned{animation:pinRainbow 2s linear infinite;border-width:3px!important;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
  <div class="nav" style="display:flex;align-items:center;">
    <button class="nb on" onclick="goPage('home')">홈</button>
    <button class="nb" onclick="goPage('log')">기록</button>
    <button class="nb" onclick="goPage('exp')">놀이터</button>
    <button class="nb" onclick="goPage('soul')">대화</button>
    <button onclick="goPage('settings')" id="settings-icon-btn" style="margin-left:auto;background:none;border:none;cursor:pointer;padding:6px 10px;color:var(--ink3);display:flex;align-items:center;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
  </div>

  <div id="page-home" class="page on">
    <!-- 날짜/스트릭 -->
    <div id="user-tag-row" style="display:none;align-items:center;justify-content:space-between;margin-bottom:6px;">
      <div id="user-tag" style="font-size:12px;color:var(--ink3);"></div>
      <button id="msg-btn" onclick="toggleMsgPanel()" style="font-size:18px;background:none;border:none;cursor:pointer;padding:0;line-height:1;">💌</button>
    </div>
    <!-- 메시지 패널 -->
    <div id="msg-panel" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:500;align-items:flex-end;justify-content:center;">
      <div style="background:var(--bg);border-radius:16px 16px 0 0;width:100%;max-width:540px;max-height:70vh;display:flex;flex-direction:column;padding:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <div style="font-size:13px;font-weight:500;color:var(--ink);" id="msg-title">💌 메시지</div>
          <button onclick="toggleMsgPanel()" style="background:none;border:none;cursor:pointer;font-size:16px;color:var(--ink3);">✕</button>
        </div>
        <div id="msg-list" style="flex:1;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;min-height:120px;"></div>
        <div style="display:flex;gap:8px;">
          <input id="msg-input" placeholder="메시지 입력..." style="flex:1;font-size:13px;padding:8px 12px;border:0.5px solid var(--bd2);border-radius:99px;background:var(--bg);color:var(--ink);font-family:inherit;" onkeydown="if(event.key==='Enter'){event.preventDefault();sendMsg();}"/>
          <button onclick="sendMsg()" style="font-size:13px;padding:8px 14px;border-radius:99px;background:#5c4f47;color:#fff;border:none;cursor:pointer;font-family:inherit;">전송</button>
        </div>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
      <div id="date-display" style="font-size:13px;color:var(--ink2);"></div>
      <div id="streak-display" style="font-size:11px;color:var(--ink3);"></div>
    </div>

    <!-- 목표+한마디 토글 -->
    <div class="card" style="padding:12px 16px;margin-bottom:12px;">
      <button class="toggle-btn" onclick="toggleTopPanel()">
        <span id="goals-summary" style="font-size:12px;color:var(--ink3);">목표 · 한마디</span>
        <span id="top-arrow" style="font-size:11px;color:var(--ink3);">▼</span>
      </button>
      <div id="top-panel" style="display:none;padding-top:10px;">
        <div id="goals-card"></div>
        <div style="margin-top:8px;padding-top:8px;border-top:0.5px solid var(--bd);">
          <div id="wdisp" style="font-family:Georgia,serif;font-size:14px;color:var(--ink);line-height:1.5;margin-bottom:6px;"></div>
          <button onclick="cycleWord()" style="font-size:11px;padding:3px 10px;border:0.5px solid var(--bd2);border-radius:99px;background:transparent;cursor:pointer;color:var(--ink3);font-family:inherit;">다음 문장</button>
        </div>
      </div>
    </div>

    <!-- 에너지 기반 -->
    <div class="card" style="padding:12px 16px;margin-bottom:12px;">
      <div style="font-size:12px;color:var(--ink2);margin-bottom:10px;line-height:1.5;">🌷 우직한 목표, 우연을 포착할 여유, 취향을 고려한 시스템? 약간의 고집</div>
      <div id="energy-checks"></div>
    </div>

    <!-- 탈리마크 -->
    <div class="card">
      <!-- 범례 + 기상/취침 -->
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:8px;">
        <div id="proj-legend" style="display:flex;gap:6px;flex-wrap:wrap;flex:1;"></div>
        <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;">
          <button id="btn-wake" onclick="editSleep('wake')" style="font-size:11px;padding:3px 9px;border-radius:99px;border:1.5px solid var(--bd2);background:transparent;cursor:pointer;color:var(--ink3);font-family:inherit;white-space:nowrap;">기상</button>
          <button id="btn-sleep" onclick="editSleep('sleep')" style="font-size:11px;padding:3px 9px;border-radius:99px;border:1.5px solid var(--bd2);background:transparent;cursor:pointer;color:var(--ink3);font-family:inherit;white-space:nowrap;">취침</button>
          <button id="btn-exercise" onclick="toggleExercise()" style="font-size:11px;padding:3px 9px;border-radius:99px;border:1.5px solid var(--bd2);background:transparent;cursor:pointer;color:var(--ink3);font-family:inherit;white-space:nowrap;">운동</button>
        </div>
      </div>
      <!-- 좌우 탈리 -->
      <div style="display:flex;gap:16px;align-items:flex-start;">
        <div style="flex:1;min-width:0;">
          <div class="tally-wrap" id="tally-wrap-left"></div>
        </div>
        <div style="width:0.5px;background:var(--bd);align-self:stretch;"></div>
        <div style="flex:1;min-width:0;">
          <div class="tally-wrap" id="tally-wrap-right"></div>
        </div>
      </div>
      <div class="tstats" id="tstats">오늘 0번 · 0분</div>
    </div>

    <!-- 할일 -->
    <div class="card">
      <div class="todo-list" id="tlist"></div>
      <div class="add-row">
        <input id="ntodo" placeholder="할 일 추가 (! 붙이면 30분)" />
        <button class="btn" id="btn-todo">추가</button>
      </div>
      <div style="margin-top:8px;">
        <button onclick="toggleArchive()" style="font-size:11px;color:var(--ink3);background:none;border:none;cursor:pointer;font-family:inherit;padding:4px 0;">
          보관함 <span id="archive-count"></span> <span id="archive-arrow">▼</span>
        </button>
        <div id="archive-list" style="display:none;margin-top:6px;"></div>
      </div>
    </div>

    <!-- 하루 마무리 토글 -->
    <div class="card" style="padding:0;overflow:hidden;">
      <button class="toggle-btn" onclick="toggleWrapUp()" style="padding:12px 16px;">
        <span style="font-size:13px;color:var(--ink2);">하루 마무리</span>
        <span id="wrapup-arrow" style="font-size:11px;color:var(--ink3);">▼</span>
      </button>
      <div id="wrapup-body" style="display:none;padding:0 16px 16px;">
        <p style="font-size:13px;color:var(--ink2);margin-bottom:12px;">오늘 찍은 항목에 에너지 +/- 표시</p>
        <div id="elist"></div>
        <div class="divider"></div>
        <div id="felist"></div>
        <button class="btn" style="margin-bottom:12px;" onclick="addFE()">+ 한 줄 추가</button>
        <div class="divider"></div>
        <input class="sinput" id="inp-learned" placeholder="마음에 든 점"/>
        <input class="sinput" id="inp-proud" placeholder="효과를 본 점"/>
        <input class="sinput" id="inp-tmr" placeholder="인정하는 점"/>
        <button class="btn btn-acc" onclick="saveWU()" style="width:100%;">마무리 저장</button>
      </div>
    </div>
  </div>

  <div id="page-log" class="page">
    <!-- 주간 그래프 -->
    <div class="card" style="margin-bottom:10px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <button onclick="changeWeek(-1)" style="font-size:18px;background:none;border:none;cursor:pointer;color:var(--ink2);padding:0 4px;">‹</button>
        <div id="week-label" style="font-size:12px;color:var(--ink2);"></div>
        <button onclick="changeWeek(1)" style="font-size:18px;background:none;border:none;cursor:pointer;color:var(--ink2);padding:0 4px;">›</button>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center;">
        <div id="week-day-btns" style="display:flex;gap:5px;flex-wrap:wrap;flex:1;"></div>
        <button onclick="toggleChartAll()" id="btn-chart-all" style="font-size:11px;padding:3px 9px;border-radius:99px;border:1.5px solid var(--bd2);background:transparent;cursor:pointer;color:var(--ink3);font-family:inherit;white-space:nowrap;">전체</button>
      </div>
      <div style="position:relative;height:180px;">
        <canvas id="week-chart"></canvas>
      </div>
    </div>
    <!-- 일간 기록 토글 -->
    <div class="card" style="padding:0;overflow:hidden;margin-bottom:10px;">
      <button class="toggle-btn" onclick="toggleLogDaily()" style="padding:12px 16px;">
        <span style="font-size:12px;letter-spacing:0.06em;color:var(--ink3);">일간 기록</span>
        <span id="log-daily-arrow" style="font-size:11px;color:var(--ink3);">▼</span>
      </button>
      <div id="log-daily-body" style="display:none;padding:0 12px 12px;">
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;" id="log-pstrip"></div>
        <div id="log-content"></div>
      </div>
    </div>
    <!-- 월간 캘린더 -->
    <div class="card" style="margin-bottom:10px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <button onclick="changeMonth(-1)" style="font-size:18px;background:none;border:none;cursor:pointer;color:var(--ink2);padding:0 4px;">‹</button>
        <div id="mo-label" style="font-size:13px;color:var(--ink2);font-weight:500;"></div>
        <button onclick="changeMonth(1)" style="font-size:18px;background:none;border:none;cursor:pointer;color:var(--ink2);padding:0 4px;">›</button>
      </div>
      <div id="mo-heatmap"></div>
    </div>
    <!-- 프로젝트별 누적 토글 -->
    <div class="card" style="padding:0;overflow:hidden;">
      <button class="toggle-btn" onclick="toggleMoContent()" style="padding:12px 16px;">
        <span style="font-size:12px;letter-spacing:0.06em;color:var(--ink3);">프로젝트별 누적</span>
        <span id="mo-toggle-arrow" style="font-size:11px;color:var(--ink3);">▼</span>
      </button>
      <div id="mo-content" style="display:none;padding:0 12px 12px;"></div>
    </div>
  </div>
  <div id="page-exp" class="page" style="padding:0;position:fixed;inset:0;top:45px;z-index:10;display:none;flex-direction:column;">
    <!-- 상단 컨트롤 -->
    <div id="exp-topbar" style="padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:0.5px solid var(--bd);background:var(--bg);flex-shrink:0;min-height:64px;">
      <div id="exp-energy-week" style="display:flex;gap:4px;"></div>
      <textarea id="exp-free-memo" placeholder="자유 메모" oninput="S.expFreeMemo=this.value;sv();" style="flex:1;font-size:12px;padding:6px 10px;border:0.5px solid var(--bd2);border-radius:12px;background:var(--bg2);color:var(--ink);font-family:inherit;margin:0 10px;outline:none;resize:none;line-height:1.5;"></textarea>
      <button id="exp-ideas-btn" onclick="toggleIdeasPanel()" style="display:none;font-size:11px;padding:4px 11px;border-radius:99px;border:1.5px solid var(--bd2);background:transparent;cursor:pointer;color:var(--ink3);font-family:inherit;">💡 대기</button>
      <button id="exp-mode-btn" onclick="toggleExpMode()" style="font-size:11px;padding:4px 11px;border-radius:99px;border:1.5px solid var(--bd2);background:transparent;cursor:pointer;color:var(--ink3);font-family:inherit;">👁 보기모드</button>
    </div>
    <!-- 메인 영역 -->
    <div style="display:flex;flex:1;overflow:hidden;position:relative;">
      <!-- 아웃라인 패널 (편집모드만) -->
      <div id="exp-outline-panel" style="display:none;width:240px;flex-shrink:0;flex-direction:column;background:var(--bg);border-right:0.5px solid var(--bd);">
        <div style="padding:6px 10px;font-size:10px;color:var(--ink3);border-bottom:0.5px solid var(--bd);flex-shrink:0;">Tab 들여쓰기 · Shift+Tab 내어쓰기</div>
        <textarea id="exp-outline-input" oninput="onOutlineInput()" style="flex:1;font-size:12px;padding:8px 10px;border:none;outline:none;resize:none;font-family:inherit;color:var(--ink);background:var(--bg);line-height:1.9;"></textarea>

function kstNow(){

  const kst=new Date(d.getTime()+9*60*60*1000);

  if(kst.getUTCHours()<4) kst.setUTCDate(kst.getUTCDate()-1);
  return kst;
}

function makeTallyGroupSVG(items,scale,onHover,onLeave,onClickStroke){
  const sc=scale||1;
  const W=Math.round(58*sc),H=Math.round(60*sc);
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width',''+W);svg.setAttribute('height',''+H);
  svg.setAttribute('viewBox','0 0 58 60');
  const xPos=[9,19,29,39];
  items.forEach((h,j)=>{
    const p=S.projects.find(x=>x.name===h.proj)||S.projects[0];
    const sw=h.thick?3.2:2;
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.style.cursor='pointer';
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    if(j<4){
      line.setAttribute('x1',''+xPos[j]);line.setAttribute('y1','5');
      line.setAttribute('x2',''+xPos[j]);line.setAttribute('y2','55');
    } else {
      line.setAttribute('x1','3');line.setAttribute('y1','50');
      line.setAttribute('x2','53');line.setAttribute('y2','10');
    }
    line.setAttribute('stroke',p.color);
    line.setAttribute('stroke-width',''+sw);
    line.setAttribute('stroke-linecap','round');
    let hit;
    if(j<4){
      hit=document.createElementNS('http://www.w3.org/2000/svg','rect');
      hit.setAttribute('x',''+(xPos[j]-7));hit.setAttribute('y','0');
      hit.setAttribute('width','14');hit.setAttribute('height','60');
      hit.setAttribute('fill','transparent');
    } else {
      hit=document.createElementNS('http://www.w3.org/2000/svg','line');
      hit.setAttribute('x1','3');hit.setAttribute('y1','50');
      hit.setAttribute('x2','53');hit.setAttribute('y2','10');
      hit.setAttribute('stroke','transparent');
      hit.setAttribute('stroke-width','14');
      hit.setAttribute('stroke-linecap','round');
    }
    g.appendChild(line);g.appendChild(hit);
    if(onHover){
      g.addEventListener('mouseenter',e=>onHover(e,h,j));
      g.addEventListener('mouseleave',()=>{if(onLeave)onLeave();});
    }
    if(onClickStroke){
      g.addEventListener('click',e=>{e.stopPropagation();onClickStroke(h,j);});
    }
    svg.appendChild(g);
  });
  return svg;
}

function renderLegend(){
  const el=document.getElementById('proj-legend');

    const name=document.createElement('span');

function renderTallies(){
  const hs=GT();
  const elL=document.getElementById('tally-wrap-left');
  const elR=document.getElementById('tally-wrap-right');
  if(!elL||!elR)return;
  elL.innerHTML='';elR.innerHTML='';
  const hsL=hs.filter(h=>h&&!isRight(h.proj));
  const hsR=hs.filter(h=>h&&isRight(h.proj));

  function renderInto(el,hsArr,scale){
    const nFull=Math.floor(hsArr.length/5);
    const rem=hsArr.length%5;
    function makeGrp(items){
      const grp=document.createElement('div');
      grp.className='tally-group';
      grp.appendChild(makeTallyGroupSVG(items,scale,
        (e,h)=>{
          const pm=h.energy==='+'?'+ ':h.energy==='-'?'- ':'';
          showTip(e,pm+'['+h.proj+'] '+(h.note||'(설명없음)')+'\n클릭하면 삭제');
        },
        hideTip,
        (h)=>{
          const hs2=GT();const idx=hs2.indexOf(h);
          if(idx>-1){hs2.splice(idx,1);sv();renderTallies();renderElist();}
        }
      ));
      return grp;
    }
    for(let g=0;g<nFull;g++) el.appendChild(makeGrp(hsArr.slice(g*5,g*5+5)));
    if(rem>0) el.appendChild(makeGrp(hsArr.slice(nFull*5)));
  }

  renderInto(elL,hsL,2.04);
  renderInto(elR,hsR,1.0);

  const filled=hs.filter(h=>h);
  const mins=filled.reduce((a,h)=>a+(h.thick?30:20),0);
  document.getElementById('tstats').textContent='오늘 '+filled.length+'번 · '+mins+'분';
}

let _chartFocusDay=null;

function toggleChartAll(){

function renderWeekChart(){
  const dayNames=['일','월','화','수','목','금','토'];
  const DAY_COLORS=['#E57373','#FF9800','#FDD835','#66BB6A','#42A5F5','#5C6BC0','#AB47BC'];
  const btnEl=document.getElementById('week-day-btns');
  // 이번 주 월요일 기준으로 7일
  const today=new Date();
  const todayDay=today.getDay(); // 0=일, 1=월 ...
  const mondayOffset=todayDay===0?-6:1-todayDay; // 이번 주 월요일까지의 offset
  const keys=[];
  for(let i=0;i<7;i++){
    const d=new Date();
    d.setDate(today.getDate()+mondayOffset+_weekOffset+i);
    keys.push(d.toISOString().slice(0,10));
  }
  const colors=keys.map(k=>{const d=new Date(k+'T12:00:00');return DAY_COLORS[d.getDay()];});
  // 주간 레이블
  const wlabel=document.getElementById('week-label');
  if(wlabel)wlabel.textContent=keys[0].slice(5)+' (월) ~ '+keys[6].slice(5)+' (일)'+(_weekOffset===0?' · 이번 주':'');
  if(btnEl){
    btnEl.innerHTML='';
    keys.forEach((k,idx)=>{
      const d=new Date(k+'T12:00:00');
      const dow=dayNames[d.getDay()];
      const btn=document.createElement('button');
      const isActive=_chartFocusDay===k;
      const btnColor=DAY_COLORS[new Date(k+'T12:00:00').getDay()];
      btn.style.cssText='font-size:11px;padding:3px 8px;border-radius:99px;border:1.5px solid '+btnColor+';cursor:pointer;font-family:inherit;transition:all 0.1s;background:'+(isActive?btnColor:'transparent')+';color:'+(isActive?'#fff':'var(--ink3)')+';';
      btn.textContent=dow+(idx===6?' (오늘)':'');
      btn.onclick=()=>{_chartFocusDay=isActive?null:k;renderWeekChart();};
      btnEl.appendChild(btn);
    });
  }
  const canvas=document.getElementById('week-chart');
  if(!canvas)return;
  if(canvas._chartInstance){canvas._chartInstance.destroy();canvas._chartInstance=null;}
  const datasets=[];
  const annotations=[];
  keys.forEach((k,idx)=>{
    const hs=(S.tallies[k]||[]).filter(h=>h);
    const isFaded=_chartFocusDay?_chartFocusDay!==k:false;
    if(!hs.length&&!(_chartFocusDay===k))return;
    const d=new Date(k+'T12:00:00');
    const dow=dayNames[d.getDay()];
    const pts=[];let cumMins=0;
    const withTime=hs.filter(h=>h.time);
    const noTime=hs.filter(h=>!h.time);
    const sorted=[...withTime].sort((a,b)=>new Date(a.time)-new Date(b.time));
    // time 없는 것들은 그래프에서 제외 (정오 고정이 그래프 왜곡 유발)
    // 대신 time 있는 것만 표시, noTime이 있으면 별도 표기
    if(!sorted.length&&noTime.length){
      // time이 하나도 없으면 9~18시 사이 균등 배분
      noTime.forEach((h,ni)=>{
        const hf=9+(ni/(noTime.length+1))*9;
        cumMins+=h.thick?30:20;
        pts.push({x:Math.round(hf*10)/10,y:cumMins});
      });
    } else {
      sorted.forEach(h=>{
        const t=new Date(h.time);
        const hf=t.getHours()+t.getMinutes()/60;
        cumMins+=h.thick?30:20;
        pts.push({x:Math.round(hf*10)/10,y:cumMins});
      });
    }
    if(!pts.length)return;
    const dayColor=DAY_COLORS[new Date(k+'T12:00:00').getDay()];
    datasets.push({
      label:k.slice(5)+' ('+dow+')',
      data:pts,
      borderColor:dayColor,
      backgroundColor:'transparent',
      borderWidth:isFaded?1:2,
      pointRadius:isFaded?1:3,
      tension:0,
      borderDash:isFaded?[3,3]:[],
    });
    // 기상/취침 — 선 시작/끝에 마커 추가
    const sl=S.sleep&&S.sleep[k]?S.sleep[k]:{};
    if(sl.wake&&pts.length&&(!_chartFocusDay||_chartFocusDay===k)){
      const t=new Date(sl.wake);const tKST=new Date(t.getTime()+9*60*60*1000);
      let hf=Math.round((tKST.getUTCHours()+tKST.getUTCMinutes()/60)*10)/10;
      if(hf<4)hf+=24;
      pts.unshift({x:hf,y:0});
      // 기상 별 포인트 별도 dataset
      datasets.push({
        label:'기상 '+k.slice(5),data:[{x:hf,y:0}],
        borderColor:dayColor,backgroundColor:dayColor,
        pointStyle:'star',pointRadius:isFaded?3:8,
        showLine:false,type:'scatter'
      });
    }
    if(sl.sleep&&pts.length&&(!_chartFocusDay||_chartFocusDay===k)){
      const t=new Date(sl.sleep);const tKST=new Date(t.getTime()+9*60*60*1000);
      let hf=Math.round((tKST.getUTCHours()+tKST.getUTCMinutes()/60)*10)/10;
      if(hf<4)hf+=24;
      pts.push({x:hf,y:pts[pts.length-1].y});
      // 취침 별 포인트 별도 dataset
      datasets.push({
        label:'취침 '+k.slice(5),data:[{x:hf,y:pts[pts.length-1].y}],
        borderColor:dayColor,backgroundColor:dayColor,
        pointStyle:'star',pointRadius:isFaded?3:8,
        showLine:false,type:'scatter'
      });
    }
  });
  if(!datasets.length){
    const ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#a8a09c';ctx.font='12px sans-serif';ctx.textAlign='center';
    ctx.fillText('탈리마크를 찍으면 여기에 그래프가 나타나요',canvas.width/2,80);
    return;
  }
  const ctx=canvas.getContext('2d');
  canvas._chartInstance=new Chart(ctx,{
    type:'line',
    data:{datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'nearest',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:item=>item.dataset.label+': '+item.parsed.y+'분'}}
      },
      scales:{
        x:{type:'linear',min:4,max:28,ticks:{stepSize:3,callback:v=>(v>=24?v-24:v)+'시',font:{size:10}},grid:{color:'rgba(0,0,0,0.04)'}},
        y:{beginAtZero:true,ticks:{callback:v=>v+'분',font:{size:10}},grid:{color:'rgba(0,0,0,0.04)'}}
      }
    }
  });
}

function renderMonthly(){
  if(!S.viewMonth)S.viewMonth=MK();
  const mk=S.viewMonth;
  const labelEl=document.getElementById('mo-label');
  if(labelEl)labelEl.textContent=mk.slice(0,4)+'년 '+parseInt(mk.slice(5,7))+'월';
  const heatEl=document.getElementById('mo-heatmap');
  if(heatEl){
    const year=parseInt(mk.slice(0,4)),month=parseInt(mk.slice(5,7))-1;
    const dim=new Date(year,month+1,0).getDate();
    const firstDay=new Date(year,month,1).getDay();
    heatEl.innerHTML='';
    const grid=document.createElement('div');
    grid.style.cssText='display:grid;grid-template-columns:repeat(7,1fr);gap:4px;';
    ['일','월','화','수','목','금','토'].forEach(d=>{
      const c=document.createElement('div');
      c.style.cssText='font-size:10px;color:var(--ink3);text-align:center;padding-bottom:4px;';
      c.textContent=d;grid.appendChild(c);
    });
    for(let i=0;i<firstDay;i++)grid.appendChild(document.createElement('div'));
    const HEAT_ORDER=['몸+돈','AI/자동화','링크닷 실험','닷슬래시 업무','휴식'];
    for(let d=1;d<=dim;d++){
      const dk=mk+'-'+String(d).padStart(2,'0');
      const isTodayCell=dk===TK();
      const dayTallies=(S.tallies[dk]||[]).filter(h=>h);
      const projCount={};
      dayTallies.forEach(h=>{projCount[h.proj]=(projCount[h.proj]||0)+1;});
      const maxCount=Math.max(1,...Object.values(projCount));
      const cellDiv=document.createElement('div');
      cellDiv.style.cssText='border-radius:4px;overflow:hidden;display:flex;flex-direction:column;'+(isTodayCell?'outline:2px solid #c4b8e8;outline-offset:1px;':'')+'min-height:28px;position:relative;background:transparent;';
      // 날짜 숫자
      const dnDiv=document.createElement('div');
      dnDiv.style.cssText='font-size:10px;color:var(--ink3);text-align:center;padding:2px 0;position:relative;z-index:1;';
      dnDiv.textContent=d;
      // 막대들 — 프로젝트 순서대로 세로 막대
      const barsDiv=document.createElement('div');
      barsDiv.style.cssText='display:flex;flex:1;width:100%;';
      HEAT_ORDER.forEach(pname=>{
        const cnt=projCount[pname]||0;
        const proj=S.projects.find(x=>x.name===pname);
        const col=proj?proj.color:'#ccc';
        const opacity=cnt===0?0:cnt===1?0.3:cnt===2?0.55:cnt===3?0.75:0.95;
        const bar=document.createElement('div');
        bar.style.cssText='flex:1;background:'+(cnt>0?col:'transparent')+';opacity:'+opacity+';';
        barsDiv.appendChild(bar);
      });
      cellDiv.appendChild(dnDiv);
      cellDiv.appendChild(barsDiv);
      if(dayTallies.length>0)cellDiv.title=dk+' · '+dayTallies.length+'번';
      grid.appendChild(cellDiv);
    }
    heatEl.appendChild(grid);
  }
}

function startOutlineResize(e){
  const panel = document.getElementById('exp-outline-panel');
  if(!panel) return;
  const startX = e.clientX, startW = panel.offsetWidth;
  const onMove = mv => {panel.style.width=Math.min(480,Math.max(120,startW+(mv.clientX-startX)))+'px';};
  const onUp = () => {document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);};
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
  e.preventDefault();
}

}

function parseOutline(text){
  const lines=text.split('\n').filter(l=>l.trim());
  const root={label:'root',children:[],depth:-1};
  const stack=[root];
  lines.forEach(line=>{
    const depth=(line.match(/^\t*/)[0]||'').length;
    const label=line.trim();
    if(!label) return;
    const node={label,children:[],depth};
    while(stack.length>1&&stack[stack.length-1].depth>=depth) stack.pop();
    stack[stack.length-1].children.push(node);
    stack.push(node);
  });
  return root.children;
}

const TREE_COLORS=['#d4c8be','#c4b8e8','#8ed4b0','#f0a8a8','#a8c8f0','#f0e8a8','#f0c8a8'];
const EXP_STATUS_BORDER={new:'var(--bd2)',ing:'#f0a8a8',done:'#8ed4b0',stop:'#c4b8e8'};
const EXP_STATUS_ICON={new:'',ing:'🔥 ',done:'✓ ',stop:'⏸ '};

function renderTreeVis(){
  const vis=document.getElementById('exp-tree-vis');
  if(!vis) return;
  const input=document.getElementById('exp-outline-input');
  const text=(input?input.value:'')||(S.expOutline||'');
  const tree=parseOutline(text);
  vis.innerHTML='';
  if(!tree.length){
    vis.innerHTML='<div style="font-size:13px;color:var(--ink3);font-style:italic;padding:20px;">아웃라인을 입력하면 트리가 나타나요</div>';
    return;
  }
  const NODE_W=120,NODE_H=36,H_GAP=56,V_GAP=14;
  const nodes=[],edges=[];
  function calcH(list){let h=0;list.forEach(n=>{if(n.children.length)h+=calcH(n.children);else h+=NODE_H+V_GAP;});return h;}
  function place(list,depth,y,parentIdx){
    list.forEach(n=>{
      const id=nodes.length;
      nodes.push({id,label:n.label,x:depth*(NODE_W+H_GAP),y,depth});
      if(parentIdx!==null) edges.push({from:parentIdx,to:id});
      const pid=id;
      if(n.children.length){place(n.children,depth+1,y,pid);y+=calcH(n.children);}
      else y+=NODE_H+V_GAP;
    });
  }
  place(tree,0,0,null);
  const maxX=nodes.reduce((m,n)=>Math.max(m,n.x),0)+NODE_W+40;
  const maxY=nodes.reduce((m,n)=>Math.max(m,n.y),0)+NODE_H+40;
  const wrap=document.createElement('div');
  wrap.style.cssText='position:relative;width:'+maxX+'px;height:'+maxY+'px;';
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width',maxX);svg.setAttribute('height',maxY);
  svg.style.cssText='position:absolute;top:0;left:0;pointer-events:none;';
  edges.forEach(e=>{
    const f=nodes[e.from],t=nodes[e.to];
    const fx=f.x+NODE_W,fy=f.y+NODE_H/2,tx=t.x,ty=t.y+NODE_H/2,cx=(fx+tx)/2;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M ${fx} ${fy} C ${cx} ${fy}, ${cx} ${ty}, ${tx} ${ty}`);
    path.setAttribute('stroke','var(--bd2)');path.setAttribute('stroke-width','1.5');path.setAttribute('fill','none');
    svg.appendChild(path);
  });
  wrap.appendChild(svg);
  nodes.forEach(n=>{
    const data=(S.expNotes&&S.expNotes[n.label])||{};
    const status=data.status||'new';
    const borderColor=EXP_STATUS_BORDER[status];
    const div=document.createElement('div');
    div.style.cssText=`position:absolute;left:${n.x}px;top:${n.y}px;width:${NODE_W}px;height:${NODE_H}px;background:var(--bg);border:1.5px solid ${borderColor};border-radius:8px;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:500;color:var(--ink);overflow:hidden;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,0.04);`;
    div.textContent=EXP_STATUS_ICON[status]+n.label;
    div.title=n.label;
    if(data.pinned) div.classList.add('gogo-pinned');
    div.addEventListener('click',()=>openGogoPopup(n.label));
    wrap.appendChild(div);
    if(data.sublabel){
      const sub=document.createElement('div');
      sub.style.cssText=`position:absolute;left:${n.x}px;top:${n.y+NODE_H+2}px;width:${NODE_W}px;font-size:10px;color:var(--ink3);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;`;
      sub.textContent=data.sublabel;
      wrap.appendChild(sub);
    }
  });
  vis.appendChild(wrap);
  // 휠 이벤트
  const vw=document.getElementById('exp-vis-wrap');
  if(vw&&!vw._wheelInit){vw._wheelInit=true;vw.addEventListener('wheel',handleTreeWheel,{passive:false});}
}

function expInitOutlineEvents(){
  const inp=document.getElementById('exp-outline-input');
  if(!inp||inp._init) return;
  inp._init=true;
  if(S.expOutline) inp.value=S.expOutline;
  inp.addEventListener('keydown',e=>{
    if(e.key==='Tab'){
      e.preventDefault();
      const s=inp.selectionStart,v=inp.value;
      if(e.shiftKey){const ls=v.lastIndexOf('\n',s-1)+1;if(v[ls]==='\t'){inp.value=v.slice(0,ls)+v.slice(ls+1);inp.selectionStart=inp.selectionEnd=s-1;}}
      else{inp.value=v.slice(0,s)+'\t'+v.slice(s);inp.selectionStart=inp.selectionEnd=s+1;}
      S.expOutline=inp.value;sv();renderTreeVis();
    }
  });
}

let _gogoPopupKey=null;
const DEFAULT_NOTE_GOGO='의도 : \n가설 : \n목표 KPI : \n결과 : \n이유 : ';

function openGogoPopup(label){
  _gogoPopupKey=label;
  if(!S.expNotes)S.expNotes={};
  const data=S.expNotes[label]||{};
  document.getElementById('gogo-popup-title').textContent=label;
  document.getElementById('gogo-popup-sublabel').value=data.sublabel||'';
  document.getElementById('gogo-popup-status').value=data.status||'new';
  document.getElementById('gogo-popup-note').value=data.note||DEFAULT_NOTE_GOGO;
  const pinBtn=document.getElementById('gogo-pin-btn');
  if(pinBtn)pinBtn.style.background=data.pinned?'#f0a8a8':'transparent';
  let dates=[];
  if(data.createdAt)dates.push('생성: '+data.createdAt);
  if(data.statusLog)data.statusLog.forEach(l=>{if(l.status==='ing')dates.push('진행중: '+l.date);if(l.status==='done')dates.push('완료: '+l.date);});

  document.getElementById('gogo-popup-bg').style.display='flex';
  setTimeout(()=>document.getElementById('gogo-popup-sublabel').focus(),100);
}

function closeGogoPopup(){
  document.getElementById('gogo-popup-bg').style.display='none';
  _gogoPopupKey=null;
}

function saveGogoPopup(){
  if(!_gogoPopupKey)return;
  if(!S.expNotes)S.expNotes={};
  const prev=S.expNotes[_gogoPopupKey]||{};
  const newStatus=document.getElementById('gogo-popup-status').value;
  const statusLog=prev.statusLog||[];
  if(newStatus!==(prev.status||'new'))statusLog.push({status:newStatus,date:TK()});
  S.expNotes[_gogoPopupKey]={
    ...prev,
    sublabel:document.getElementById('gogo-popup-sublabel').value.trim(),
    status:newStatus,
    note:document.getElementById('gogo-popup-note').value,
    createdAt:prev.createdAt||TK(),
    statusLog
  };
  sv();closeGogoPopup();renderTreeVis();
}

function deleteGogoNode(){

function toggleGogoPin(){

    // 첫 클릭 — 현재 시각 바로 기록

    sv();renderSleepButtons();

  if(!btn)return;
  const t=new Date(existing);const tKST=new Date(t.getTime()+9*60*60*1000);
